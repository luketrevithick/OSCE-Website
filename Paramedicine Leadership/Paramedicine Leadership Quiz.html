<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Paramedicine Leadership — Revision Quiz</title>
<style>
  :root{
    --navy-deep:#0B1522;
    --navy:#142238;
    --navy-mid:#1E3350;
    --paper:#F3F1E6;
    --paper-dim:#E9E5D4;
    --ink:#1C2331;
    --ink-muted:#5B6472;
    --brass:#B8872E;
    --brass-dark:#8C6A24;
    --green:#3F7A5A;
    --green-bg:#E4EFE7;
    --clay:#A8453A;
    --clay-bg:#F5E7E4;
    --hairline:#D9D4C2;
    --hairline-dark:#33475F;
    --font-serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", "Times New Roman", serif;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-sans);
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2{font-family:var(--font-serif); font-weight:600; margin:0 0 .4em 0;}
  p{margin:0 0 .9em 0;}
  button{font-family:var(--font-sans);}
  a{color:inherit;}

  /* ---------- header / chrome ---------- */
  .header-bar{
    background:var(--navy-deep);
    color:#EDEAD9;
    position:sticky;
    top:0;
    z-index:5;
  }
  .header-inner{
    max-width:720px;
    margin:0 auto;
    padding:14px 20px 10px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px 16px;
  }
  .brand-title{
    font-family:var(--font-serif);
    font-size:1.05rem;
    letter-spacing:.2px;
  }
  .header-meta{
    display:flex;
    align-items:center;
    gap:16px;
    font-size:.85rem;
    color:#C9C4AE;
  }
  .link-btn{
    background:none;
    border:none;
    color:#D8B565;
    cursor:pointer;
    font-size:.85rem;
    padding:2px 0;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .link-btn:hover{color:#EFCB86;}
  .progress-track{
    height:3px;
    background:var(--navy-mid);
    max-width:720px;
    margin:0 auto;
  }
  .progress-fill{
    height:100%;
    background:var(--brass);
    width:0%;
  }
  @media (prefers-reduced-motion:no-preference){
    .progress-fill{transition:width .3s ease;}
  }

  /* ---------- layout ---------- */
  .main{
    max-width:720px;
    margin:0 auto;
    padding:28px 20px 60px 20px;
  }

  /* ---------- start screen ---------- */
  .start-card h1{font-size:1.9rem; margin-bottom:.3em;}
  .start-card .lede{color:var(--ink-muted); font-size:1.02rem;}
  .coverage{
    margin:18px 0 22px 0;
    padding:16px 18px;
    background:#fff;
    border:1px solid var(--hairline);
  }
  .coverage p{margin:0 0 8px 0; font-size:.85rem; color:var(--ink-muted);}
  .coverage ul{margin:0; padding-left:20px; columns:2; column-gap:24px; font-size:.92rem;}
  .coverage li{margin-bottom:6px; break-inside:avoid;}
  @media (max-width:520px){.coverage ul{columns:1;}}
  .toggle-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:.95rem;
    margin:18px 0 24px 0;
    cursor:pointer;
  }
  .toggle-row input{width:17px; height:17px;}

  /* ---------- card / question ---------- */
  .card{
    background:#fff;
    border:1px solid var(--hairline);
    border-top:3px solid var(--navy);
    padding:24px 24px 22px 24px;
  }
  .tag-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .tag{
    font-size:.72rem;
    padding:3px 9px;
    border:1px solid var(--hairline);
    color:var(--ink-muted);
    white-space:nowrap;
  }
  .tag-section{color:var(--navy); border-color:var(--navy-mid);}
  .tag-type{color:var(--brass-dark); border-color:var(--brass);}

  .case-block{
    background:var(--paper-dim);
    border-left:3px solid var(--brass);
    padding:12px 16px;
    margin-bottom:16px;
  }
  .case-label{
    display:block;
    font-size:.72rem;
    color:var(--ink-muted);
    margin-bottom:4px;
  }
  .case-block p{margin:0; font-size:.96rem;}

  .prompt{
    font-size:1.22rem;
    line-height:1.4;
    margin-bottom:18px;
  }
  .prompt-small{
    font-family:var(--font-serif);
    font-size:1.05rem;
    margin:6px 0 10px 0;
  }

  .hint{font-size:.85rem; color:var(--ink-muted); margin-bottom:10px;}

  .opt-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:11px 4px;
    border-bottom:1px solid var(--hairline);
    cursor:pointer;
    font-size:.98rem;
  }
  .opt-row:last-child{border-bottom:none;}
  .opt-row:hover{background:#FAF9F3;}
  .opt-row input{margin-top:3px; width:16px; height:16px; flex-shrink:0;}
  .opt-row.correct{background:var(--green-bg); border-left:3px solid var(--green); padding-left:9px;}
  .opt-row.incorrect{background:var(--clay-bg); border-left:3px solid var(--clay); padding-left:9px;}

  .match-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:10px 4px;
    border-bottom:1px solid var(--hairline);
    flex-wrap:wrap;
  }
  .match-row:last-child{border-bottom:none;}
  .match-left{font-size:.96rem; flex:1 1 220px;}
  .match-select{
    flex:1 1 220px;
    padding:7px 8px;
    border:1px solid var(--hairline-dark);
    background:#fff;
    font-family:var(--font-sans);
    font-size:.92rem;
  }
  .match-row.correct{background:var(--green-bg);}
  .match-row.incorrect{background:var(--clay-bg);}
  .correct-note{
    width:100%;
    font-size:.82rem;
    color:var(--green);
    margin-top:4px;
  }

  .feedback{
    margin-top:18px;
    padding:14px 16px;
    background:var(--paper-dim);
    border-left:3px solid var(--navy);
  }
  .feedback .verdict{
    font-weight:700;
    margin-bottom:6px;
  }
  .verdict.is-correct{color:var(--green);}
  .verdict.is-incorrect{color:var(--clay);}
  .feedback p:last-child{margin-bottom:0;}

  .actions{
    margin-top:20px;
    display:flex;
    gap:12px;
  }
  .btn{
    font-size:.95rem;
    padding:11px 22px;
    border:1px solid var(--navy);
    background:var(--navy);
    color:#fff;
    cursor:pointer;
  }
  .btn:hover{background:var(--navy-mid);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  input:focus-visible,
  select:focus-visible,
  button:focus-visible,
  .opt-row:focus-within{
    outline:2px solid var(--brass);
    outline-offset:2px;
  }

  /* ---------- results ---------- */
  .results-card h1{font-size:1.8rem;}
  .score-big{
    font-family:var(--font-serif);
    font-size:3rem;
    color:var(--navy);
    margin:6px 0 0 0;
  }
  .score-pct{color:var(--ink-muted); margin-top:0;}
  .section-table{
    width:100%;
    border-collapse:collapse;
    margin:14px 0 26px 0;
    font-size:.92rem;
  }
  .section-table td{
    padding:8px 6px;
    border-bottom:1px solid var(--hairline);
    vertical-align:middle;
  }
  .section-table td.num{white-space:nowrap; color:var(--ink-muted); width:60px;}
  .bar-cell{width:40%;}
  .bar-track{
    background:var(--hairline);
    height:8px;
    width:100%;
  }
  .bar-fill{
    background:var(--brass);
    height:100%;
  }
  .all-correct{color:var(--green); font-weight:600;}
  .review-list{display:flex; flex-direction:column; gap:18px;}
  .review-item{
    border:1px solid var(--hairline);
    border-left:3px solid var(--clay);
    padding:16px 18px;
    background:#fff;
  }
  .your-answer{color:var(--clay); font-size:.92rem;}
  .correct-answer{color:var(--green); font-size:.92rem;}
  .explanation-text{color:var(--ink-muted); font-size:.92rem; margin-top:6px;}

  .site-footer{
    max-width:720px;
    margin:0 auto;
    padding:0 20px 40px 20px;
    color:var(--ink-muted);
    font-size:.8rem;
  }
</style>

<script>
const SECTION_ORDER = [
  "Clinical Leadership Foundations",
  "Leadership Styles",
  "Organisational Behaviour & Culture",
  "Clinical Supervision",
  "Health Promotion & Health Education",
  "Community Engagement & Participatory Research",
  "Major Incident & Mass Casualty Management",
  "Learning, Debriefing & Feedback",
  "Followership",
  "Feedback Skills & Team Development"
];

const TYPE_LABEL = {
  mcq: "Multiple choice",
  multi: "Select all that apply",
  tf: "True or false",
  match: "Match the pairs"
};

const QUESTIONS = [
{id:1,
 section:"Clinical Leadership Foundations",
 type:"mcq",
 prompt:"Which of the following best captures the key distinction between clinical leadership and management discussed in the clinical leadership literature (McSherry & Pearce, 2016)?",
 options:[
     "Leadership and management describe the same clinical function and can be used interchangeably.",
     "Leadership is reserved for executive roles, while management happens only at the point of care.",
     "Leadership focuses on maintaining stable systems, while management is about inspiring vision and change.",
     "Leadership is about influencing and setting direction, while management focuses on planning and control."],
 answer:3,
 explanation:"The literature draws a classic distinction: leadership is oriented towards vision, influence and change, whereas management is oriented towards planning, organising and maintaining stable systems. The two are complementary, not identical, and neither is restricted to a single organisational level."},

{id:2,
 section:"Clinical Leadership Foundations",
 type:"tf",
 prompt:"True or false: in the clinical leadership literature, a person must hold a formal management title or supervisory rank before they can be considered a clinical leader.",
 options:[
     "True",
     "False"],
 answer:1,
 explanation:"Clinical leadership is described as emergent rather than appointed — it arises from expertise, peer respect and influence at the point of care, meaning any clinician, including a student, can demonstrate it regardless of title."},

{id:3,
 section:"Clinical Leadership Foundations",
 type:"mcq",
 prompt:"A newly graduated paramedic on their first solo shift confidently coordinates a chaotic scene, and a senior partner defers to their judgement on scene management. This is best described as an example of:",
 options:[
     "Positional authority",
     "Emergent clinical leadership",
     "Management by exception",
     "Transactional exchange"],
 answer:1,
 explanation:"The graduate has no formal rank or title, yet is exercising influence through demonstrated competence and peer respect at the point of care — the hallmark of emergent clinical leadership."},

{id:4,
 section:"Clinical Leadership Foundations",
 type:"multi",
 prompt:"Which of the following are features that distinguish clinical leadership as described in the paramedicine literature? (Select all that apply)",
 options:[
     "It can be exercised by a student paramedic",
     "It is fixed to a single formally appointed individual per shift",
     "It depends on expertise and peer respect rather than title",
     "It is only relevant in resuscitation scenarios",
     "It can be exercised by an extended care paramedic"],
 answer:[0,2,4],
 explanation:"Clinical leadership is not restricted to one appointed person, a single role, or high-acuity scenarios — it can be shown by anyone from a student to an extended care paramedic, wherever expertise and peer respect give them influence."},

{id:5,
 section:"Clinical Leadership Foundations",
 type:"mcq",
 scenario:"During a routine non-emergency transfer, a graduate paramedic notices their more experienced partner is about to administer a medication at the wrong dose. The graduate calmly and respectfully raises the concern, and the error is corrected before it reaches the patient.",
 prompt:"This exchange is best understood as:",
 options:[
     "An example of clinical leadership, since expertise and safety concerns are raised regardless of seniority.",
     "Not leadership at all, because the graduate has less overall clinical experience than their partner.",
     "An example of management, since the graduate is simply directing and coordinating a routine clinical task.",
     "A breach of professional boundaries, since a junior clinician should not question a senior colleague."],
 answer:0,
 explanation:"Clinical leadership is not about seniority — it is exercised whenever a clinician uses expertise and judgement, regardless of hierarchy, to protect patient safety."},

{id:6,
 section:"Clinical Leadership Foundations",
 type:"mcq",
 prompt:"Which out-of-hospital feature makes clinical leadership particularly important in paramedicine, compared with many in-hospital clinical settings?",
 options:[
     "Paramedics generally work within large, well-staffed, hierarchical hospital-style teams.",
     "Paramedics often work with limited resources and small teams in an unpredictable environment.",
     "Paramedics rarely need to make independent clinical decisions without direct supervision.",
     "Out-of-hospital protocols remove the need for judgement, making clinical leadership largely unnecessary."],
 answer:1,
 explanation:"The prehospital environment is variable and often under-resourced, with small crews operating with a high degree of autonomy — conditions that place a premium on clinical leadership at every level of experience."},

{id:7,
 section:"Clinical Leadership Foundations",
 type:"tf",
 prompt:"True or false: the absence of clinical leadership in a team has been linked in the literature only to worse patient outcomes, with no meaningful effect on staff wellbeing.",
 options:[
     "True",
     "False"],
 answer:1,
 explanation:"Poor or absent clinical leadership is associated with harm to both patient safety and quality of care, and to clinician wellbeing (for example, burnout and poor team culture) — the consequences extend beyond the patient alone."},

{id:8,
 section:"Clinical Leadership Foundations",
 type:"multi",
 prompt:"Which of the following are outcomes that clinical leadership has been connected to in the literature? (Select all that apply)",
 options:[
     "Patient safety",
     "Team culture",
     "Clinician wellbeing",
     "Ambulance station architecture",
     "Quality of care"],
 answer:[0,1,2,4],
 explanation:"Clinical leadership is consistently linked to patient safety, quality of care, team culture and clinician wellbeing; it has no established link to physical station design."},

{id:9,
 section:"Clinical Leadership Foundations",
 type:"mcq",
 prompt:"Two clinicians disagree about where clinical leadership should sit within a team: one argues it should always rest with the most senior officer present, the other argues it should shift fluidly to whoever has the relevant expertise in the moment. Which statement best reflects a balanced appraisal of these positions?",
 options:[
     "The fluid-expertise view is always correct, since hierarchy adds no value in a clinical team.",
     "Neither view has any real or credible support in the clinical leadership literature or in current practice.",
     "The senior-officer view is always correct, since fixed seniority removes ambiguity in every situation.",
     "Both views have genuine merit and limits, so which one fits best depends on the clinical situation at hand."],
 answer:3,
 explanation:"The learning outcome asks students to weigh strengths and limitations rather than pick a single correct model — clear command can aid speed and clarity, while distributed, expertise-based leadership can better draw on specialist skill, and over-relying on either has drawbacks."},

{id:10,
 section:"Clinical Leadership Foundations",
 type:"mcq",
 scenario:"On a cardiac arrest job, the most senior paramedic present has less recent resuscitation experience than a junior colleague who has just completed additional resuscitation training.",
 prompt:"According to a strengths-and-limitations view of where leadership should sit, what is the most defensible approach?",
 options:[
     "The junior colleague should take over the entire job, including scene command and family communication.",
     "The senior paramedic must retain all leadership regardless of skill currency, since rank alone should decide.",
     "Task leadership could shift to the more current clinician, with accountability staying at the senior level.",
     "Leadership is irrelevant during cardiac arrest, since fixed protocols dictate every single action."],
 answer:2,
 explanation:"A balanced view recognises leadership can be distributed by task and expertise, such as technical resuscitation leadership, while broader accountability may still track with seniority — an either/or framing misses this nuance."},

{id:11,
 section:"Clinical Leadership Foundations",
 type:"mcq",
 prompt:"A final-year paramedicine student is asked to identify where, in their current scope of practice, they could demonstrate clinical leadership right now, before graduation. Which of the following is the most appropriate example?",
 options:[
     "Refusing to take any instruction whatsoever from qualified paramedics until well after graduation.",
     "Waiting until formally employed as a paramedic before ever showing leadership behaviour.",
     "Taking unsupervised command of a multi-casualty incident while still a student.",
     "Speaking up respectfully about a safety concern on placement, or supporting a peer's learning."],
 answer:3,
 explanation:"Emergent clinical leadership is available at every stage of training — small, appropriate actions such as raising safety concerns or supporting peers' learning are legitimate ways for a student to demonstrate it now, well short of taking unsupervised command."},

{id:12,
 section:"Clinical Leadership Foundations",
 type:"tf",
 prompt:"True or false: reflecting on your own developing leadership is considered a core part of building clinical leadership capability, rather than a separate, unrelated skill.",
 options:[
     "True",
     "False"],
 answer:0,
 explanation:"Reflective practice on one's own leadership — recognising strengths, gaps and opportunities from placement or practice — is treated in the literature as integral to developing as a clinical leader, not an optional add-on."},

{id:13,
 section:"Leadership Styles",
 type:"match",
 prompt:"Match each leadership style to its associated foundational theorist.",
 pairs:[
   {left:"Transformational leadership", right:"James MacGregor Burns (later extended by Bernard Bass)"},
   {left:"Servant leadership", right:"Robert Greenleaf"},
   {left:"Congruent leadership", right:"David Stanley"},
   {left:"Autocratic, democratic and laissez-faire leadership", right:"Kurt Lewin"}],
 explanation:"These pairings reflect commonly cited origins in the leadership literature: Burns introduced transformational leadership, later extended by Bass; Greenleaf coined servant leadership; Stanley developed the congruent leadership model in nursing; and Lewin's classic 1939 studies identified the autocratic, democratic and laissez-faire styles."},

{id:14,
 section:"Leadership Styles",
 type:"mcq",
 prompt:"Which leadership style is defined primarily by leaders influencing followers through an exchange of rewards, recognition or correction based on performance against clear expectations?",
 options:[
     "Servant leadership",
     "Congruent leadership",
     "Authentic leadership",
     "Transactional leadership"],
 answer:3,
 explanation:"Transactional leadership operates on a system of exchange — contingent reward and management by exception — rather than on inspiring shared vision or values congruence."},

{id:15,
 section:"Leadership Styles",
 type:"mcq",
 prompt:"Which of the following best describes congruent leadership?",
 options:[
     "A leader who avoids making decisions and consistently leaves the team to fully direct itself without any guidance.",
     "A leader who consistently prioritises the wellbeing and growth of their followers above their own.",
     "A leader who motivates staff solely through formal rewards and recognition schemes.",
     "A leader whose personal values are visibly aligned with their actions, building credibility with the team."],
 answer:3,
 explanation:"Congruent leadership, as described by Stanley, centres on the alignment, or congruence, between what a leader believes and how they actually behave in clinical practice, which builds trust and credibility."},

{id:16,
 section:"Leadership Styles",
 type:"multi",
 prompt:"Which of the following styles are grouped as people-centred approaches in the clinical leadership literature? (Select all that apply)",
 options:[
     "Transformational",
     "Servant",
     "Authentic",
     "Transactional",
     "Congruent"],
 answer:[0,1,2],
 explanation:"Transformational, servant and authentic leadership are grouped as people-centred approaches, focused on relationships, growth and inspiration, in contrast to the exchange- and values-based approaches of transactional and congruent leadership."},

{id:17,
 section:"Leadership Styles",
 type:"mcq",
 prompt:"Which pairing correctly reflects the exchange- and values-based grouping of leadership styles, as distinguished from the people-centred group?",
 options:[
     "Transactional and congruent",
     "Transformational and servant",
     "Autocratic and democratic",
     "Authentic and congruent"],
 answer:0,
 explanation:"The literature contrasts people-centred approaches (transformational, servant, authentic) with exchange- and values-based approaches, made up of transactional and congruent leadership."},

{id:18,
 section:"Leadership Styles",
 type:"tf",
 prompt:"True or false: transformational leadership has consistently shown the weakest evidence base of any leadership style for improving clinician job satisfaction.",
 options:[
     "True",
     "False"],
 answer:1,
 explanation:"Transformational leadership is repeatedly associated in the literature with strong, often the strongest, links to positive outcomes such as job satisfaction and team culture, rather than the weakest evidence base."},

{id:19,
 section:"Leadership Styles",
 type:"mcq",
 prompt:"A leader who is highly focused on continually inspiring and energising their team toward an ambitious shared vision, but who provides little structured support, is most at risk of which limitation associated with transformational leadership?",
 options:[
     "Becoming excessively rigid and completely unable to adapt to a changing clinical situation.",
     "Reduced patient safety caused by excessive, inflexible rule-following.",
     "A complete absence of any team direction or shared purpose.",
     "Leader burnout from the sustained emotional energy this style demands over time."],
 answer:3,
 explanation:"A recognised limitation of transformational leadership is the high emotional investment it demands of the leader, which can lead to burnout if not balanced with adequate support."},

{id:20,
 section:"Leadership Styles",
 type:"mcq",
 scenario:"A time-critical traumatic cardiac arrest is in progress and rapid, unambiguous direction is required to coordinate simultaneous interventions.",
 prompt:"Which leadership style is generally best suited to this specific moment?",
 options:[
     "Congruent",
     "Servant",
     "Autocratic",
     "Laissez-faire"],
 answer:2,
 explanation:"In time-critical, high-acuity events, an autocratic or directive style — clear, rapid, unilateral decision-making — is generally best suited to coordinating simultaneous actions, even though it would be less appropriate for slower-paced, complex care."},

{id:21,
 section:"Leadership Styles",
 type:"mcq",
 scenario:"A paramedic is managing a complex, low-acuity welfare case involving a patient with several social and health needs, where there is time to explore options collaboratively with the patient, family and other services.",
 prompt:"Which style is generally best suited here?",
 options:[
     "A firmly autocratic, directive style with minimal team input.",
     "A more collaborative, people-centred style, such as servant or transformational leadership.",
     "A congruent leadership style, though it rarely suits a complex, low-acuity case like this one.",
     "A laissez-faire style, with no clinician input into the plan at all."],
 answer:1,
 explanation:"In complex, non-time-critical cases, collaborative, people-centred styles that draw in multiple perspectives are generally better suited than a directive approach reserved for time-critical emergencies."},

{id:22,
 section:"Leadership Styles",
 type:"multi",
 prompt:"Which of the following are recognised limitations of servant leadership? (Select all that apply)",
 options:[
     "The leader may neglect their own wellbeing while prioritising the team",
     "It can be slower to apply in time-critical emergencies requiring immediate direction",
     "It has no supporting evidence in healthcare literature",
     "It can be perceived as a lack of authority in some organisational cultures"],
 answer:[0,1,3],
 explanation:"Servant leadership's strengths, such as trust and psychological safety, come with trade-offs: risk of the leader neglecting their own needs, being too slow for emergencies, and sometimes being misread as weak authority; it does have supporting evidence in healthcare."},

{id:23,
 section:"Leadership Styles",
 type:"tf",
 prompt:"True or false: autocratic leadership used continuously, even outside time-critical situations, has been linked to poorer team culture and reduced job satisfaction over time.",
 options:[
     "True",
     "False"],
 answer:0,
 explanation:"While useful in short bursts during emergencies, a continuously autocratic style outside those situations is linked to poorer team culture, reduced input from staff, and lower job satisfaction."},

{id:24,
 section:"Leadership Styles",
 type:"mcq",
 prompt:"Which leadership style involves a leader providing minimal direction and largely allowing the team to make their own decisions?",
 options:[
     "Congruent",
     "Laissez-faire",
     "Transactional",
     "Authentic"],
 answer:1,
 explanation:"Laissez-faire leadership is characterised by a hands-off approach, offering little direction — appropriate with highly autonomous, expert teams but risky where guidance or accountability is needed."},

{id:25,
 section:"Leadership Styles",
 type:"mcq",
 prompt:"As paramedics move into extended and more autonomous scopes of practice, such as an extended care paramedic role, which shift in leadership style demand is most likely?",
 options:[
     "A reduced need for any leadership skill at all, since greater autonomy removes the need to influence others.",
     "Leadership demands that stay identical, regardless of scope of practice or setting.",
     "An increased need for people-centred, values-based styles across multidisciplinary and community settings.",
     "A permanent shift toward laissez-faire leadership in every clinical situation."],
 answer:2,
 explanation:"Extended scope roles require paramedics to work across broader, often multidisciplinary and community contexts, increasing the need for people-centred and values-based leadership alongside the directive skills still needed in emergencies."},

{id:26,
 section:"Leadership Styles",
 type:"mcq",
 scenario:"A paramedic reflects that they currently default to a highly directive style in almost every situation, including low-acuity, collaborative cases where it is not well suited, and they want to become more adaptable.",
 prompt:"Which concrete step would best help them move toward their intended leadership style?",
 options:[
     "Practise a more collaborative style in lower-stakes cases, then reflect.",

/* ---------- engine ---------- */
const app = document.getElementById("app");
const headerBar = document.getElementById("headerBar");
let state = null;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function renderStart(){
  headerBar.style.display = "none";
  app.innerHTML = `
    <section class="start-card">
      <h1>Paramedicine Leadership</h1>
      <p class="lede">A 100-question revision quiz for the Paramedicine Leadership unit, built from its stated learning outcomes.</p>
      <div class="coverage">
        <p>Covers:</p>
        <ul>
          <li>Clinical leadership foundations</li>
          <li>Leadership styles</li>
          <li>Organisational behaviour and culture</li>
          <li>Clinical supervision</li>
          <li>Health promotion and health education</li>
          <li>Participatory research and community engagement</li>
          <li>Major incident and mass casualty management</li>
          <li>Debriefing and feedback frameworks</li>
          <li>Followership</li>
          <li>Feedback skills and team development</li>
        </ul>
      </div>
      <p>Answer each question, check it, and read the explanation before moving on. Your results are broken down by topic at the end so you can see where to focus your revision.</p>
      <label class="toggle-row"><input type="checkbox" id="shuffleToggle"> Shuffle question order</label>
      <button id="startBtn" class="btn" type="button">Start quiz</button>
    </section>
  `;
  document.getElementById("startBtn").addEventListener("click", ()=>{
    const shuffleOn = document.getElementById("shuffleToggle").checked;
    startQuiz(shuffleOn);
  });
}

function startQuiz(shuffleOn){
  let order = QUESTIONS.map((_,i)=>i);
  if(shuffleOn) order = shuffle(order);
  state = { order, pos:0, score:0, sectionStats:{}, results:[] };
  SECTION_ORDER.forEach(s=>{ state.sectionStats[s] = {correct:0, total:0}; });
  headerBar.style.display = "block";
  renderQuestion();
}

function currentQuestion(){
  return QUESTIONS[state.order[state.pos]];
}

function updateHeader(){
  const total = state.order.length;
  document.getElementById("qCounter").textContent = "Question " + (state.pos+1) + " of " + total;
  document.getElementById("scoreCounter").textContent = "Score " + state.score + "/" + state.results.length;
  const pct = Math.round((state.pos/total)*100);
  document.getElementById("progressFill").style.width = pct+"%";
}

function renderAnswerWidget(q){
  if(q.type==="mcq" || q.type==="tf"){
    return q.options.map((opt,i)=>
      '<label class="opt-row" data-idx="'+i+'"><input type="radio" name="opt" value="'+i+'"><span>'+opt+"</span></label>"
    ).join("");
  }
  if(q.type==="multi"){
    return '<p class="hint">Select all that apply.</p>' + q.options.map((opt,i)=>
      '<label class="opt-row" data-idx="'+i+'"><input type="checkbox" name="opt" value="'+i+'"><span>'+opt+"</span></label>"
    ).join("");
  }
  if(q.type==="match"){
    const rights = shuffle(q.pairs.map(p=>p.right));
    return q.pairs.map((p,i)=>{
      const optionsHtml = rights.map(r=>'<option value="'+r.replace(/"/g,"&quot;")+'">'+r+"</option>").join("");
      return '<div class="match-row" data-idx="'+i+'"><div class="match-left">'+p.left+
        '</div><select class="match-select"><option value="">Select a match…</option>'+optionsHtml+"</select></div>";
    }).join("");
  }
  return "";
}

function renderQuestion(){
  const q = currentQuestion();
  updateHeader();
  const isLast = state.pos === state.order.length-1;
  let html = '<article class="card">';
  html += '<div class="tag-row"><span class="tag tag-section">'+q.section+'</span><span class="tag tag-type">'+TYPE_LABEL[q.type]+"</span></div>";
  if(q.scenario){
    html += '<div class="case-block"><span class="case-label">Scenario</span><p>'+q.scenario+"</p></div>";
  }
  html += '<h2 class="prompt">'+q.prompt+"</h2>";
  html += '<div id="answerArea">'+renderAnswerWidget(q)+"</div>";
  html += '<div id="feedback" class="feedback" hidden></div>';
  html += '<div class="actions">';
  html += '<button id="checkBtn" class="btn" type="button">Check answer</button>';
  html += '<button id="nextBtn" class="btn" type="button" hidden>'+(isLast?"See results":"Next question")+"</button>";
  html += "</div></article>";
  app.innerHTML = html;
  document.getElementById("checkBtn").addEventListener("click", onCheck);
  document.getElementById("nextBtn").addEventListener("click", onNext);
}

function readUserAnswer(q){
  if(q.type==="mcq" || q.type==="tf"){
    const checked = document.querySelector('#answerArea input[name="opt"]:checked');
    return checked ? parseInt(checked.value,10) : null;
  }
  if(q.type==="multi"){
    return [...document.querySelectorAll('#answerArea input[name="opt"]:checked')]
      .map(el=>parseInt(el.value,10)).sort((a,b)=>a-b);
  }
  if(q.type==="match"){
    return [...document.querySelectorAll("#answerArea .match-select")].map(s=>s.value);
  }
}

function isCorrect(q, userAnswer){
  if(q.type==="mcq" || q.type==="tf") return userAnswer===q.answer;
  if(q.type==="multi"){
    const correct = q.answer.slice().sort((a,b)=>a-b);
    return JSON.stringify(userAnswer)===JSON.stringify(correct);
  }
  if(q.type==="match"){
    return q.pairs.every((p,i)=>userAnswer[i]===p.right);
  }
  return false;
}

function applyFeedbackStyles(q, userAnswer){
  if(q.type==="mcq" || q.type==="tf"){
    const rows = document.querySelectorAll("#answerArea .opt-row");
    rows[q.answer].classList.add("correct");
    if(userAnswer!==null && userAnswer!==q.answer) rows[userAnswer].classList.add("incorrect");
  } else if(q.type==="multi"){
    const rows = document.querySelectorAll("#answerArea .opt-row");
    q.answer.forEach(i=>rows[i].classList.add("correct"));
    userAnswer.forEach(i=>{ if(!q.answer.includes(i)) rows[i].classList.add("incorrect"); });
  } else if(q.type==="match"){
    const rows = document.querySelectorAll("#answerArea .match-row");
    q.pairs.forEach((p,i)=>{
      if(userAnswer[i]===p.right){
        rows[i].classList.add("correct");
      } else {
        rows[i].classList.add("incorrect");
        rows[i].insertAdjacentHTML("beforeend", '<div class="correct-note">Correct: '+p.right+"</div>");
      }
    });
  }
  document.querySelectorAll("#answerArea input, #answerArea select").forEach(el=>el.disabled=true);
}

function onCheck(){
  const q = currentQuestion();
  const userAnswer = readUserAnswer(q);
  const correct = isCorrect(q, userAnswer);
  applyFeedbackStyles(q, userAnswer);

  const fb = document.getElementById("feedback");
  fb.hidden = false;
  fb.innerHTML = '<p class="verdict '+(correct?"is-correct":"is-incorrect")+'">'+(correct?"Correct.":"Not quite.")+"</p><p>"+q.explanation+"</p>";

  state.sectionStats[q.section].total++;
  if(correct){ state.sectionStats[q.section].correct++; state.score++; }
  state.results.push({qIdx: state.order[state.pos], correct, userAnswer});

  document.getElementById("checkBtn").hidden = true;
  document.getElementById("nextBtn").hidden = false;
  updateHeader();
}

function onNext(){
  if(state.pos < state.order.length-1){
    state.pos++;
    renderQuestion();
  } else {
    renderResults();
  }
}

function formatAnswer(q, ans){
  if(q.type==="mcq" || q.type==="tf") return ans===null ? "(no answer selected)" : q.options[ans];
  if(q.type==="multi") return ans.length ? ans.map(i=>q.options[i]).join("; ") : "(no answer selected)";
  if(q.type==="match") return q.pairs.map((p,i)=>p.left+" \u2192 "+(ans[i]||"(none)")).join("; ");
}
function formatCorrectAnswer(q){
  if(q.type==="mcq" || q.type==="tf") return q.options[q.answer];
  if(q.type==="multi") return q.answer.map(i=>q.options[i]).join("; ");
  if(q.type==="match") return q.pairs.map(p=>p.left+" \u2192 "+p.right).join("; ");
}

function renderResults(){
  headerBar.style.display = "none";
  const total = state.order.length;
  const pct = Math.round((state.score/total)*100);

  let html = '<section class="results-card">';
  html += "<h1>Results</h1>";
  html += '<p class="score-big">'+state.score+" / "+total+"</p>";
  html += '<p class="score-pct">'+pct+"% correct</p>";
  html += "<h2>By topic</h2>";
  html += '<table class="section-table">';
  SECTION_ORDER.forEach(s=>{
    const st = state.sectionStats[s];
    if(!st || st.total===0) return;
    const barPct = Math.round((st.correct/st.total)*100);
    html += "<tr><td>"+s+'</td><td class="num">'+st.correct+"/"+st.total+'</td><td class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:'+barPct+'%"></div></div></td></tr>';
  });
  html += "</table>";

  const missed = state.results.filter(r=>!r.correct);
  if(missed.length){
    html += "<h2>Questions to revisit</h2><div class=\"review-list\">";
    missed.forEach(r=>{
      const q = QUESTIONS[r.qIdx];
      html += '<div class="review-item">';
      html += '<div class="tag-row"><span class="tag tag-section">'+q.section+"</span></div>";
      if(q.scenario) html += '<div class="case-block"><span class="case-label">Scenario</span><p>'+q.scenario+"</p></div>";
      html += '<p class="prompt-small">'+q.prompt+"</p>";
      html += '<p class="your-answer">Your answer: '+formatAnswer(q, r.userAnswer)+"</p>";
      html += '<p class="correct-answer">Correct answer: '+formatCorrectAnswer(q)+"</p>";
      html += '<p class="explanation-text">'+q.explanation+"</p>";
      html += "</div>";
    });
    html += "</div>";
  } else {
    html += '<p class="all-correct">Every question was answered correctly.</p>';
  }

  html += '<div class="actions"><button id="restartBtn" class="btn" type="button">Try again</button></div>';
  html += "</section>";
  app.innerHTML = html;
  document.getElementById("restartBtn").addEventListener("click", renderStart);
}

document.getElementById("restartHeaderBtn").addEventListener("click", ()=>{
  if(confirm("Start over? Your current progress will be lost.")) renderStart();
});

renderStart();
</script>
